[alembic]
script_location = alembic
prepend_sys_path = src

# sqlalchemy.url is set via CLAWTION_DB_URL environment variable
# or configured dynamically in alembic/env.py
# sqlalchemy.url = postgresql+asyncpg://clawtion:clawtion@localhost:5432/clawtion

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
