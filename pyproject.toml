[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawtion"
version = "0.1.0"
description = "ローカル知識ベース + AIナレッジ検索 + ノートアプリ"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "clawtion contributors"}
]
keywords = ["knowledge-base", "rag", "vector-search", "notes", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "click>=8.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "pgvector>=0.3.0",
    "google-genai>=1.0.0",
    "watchdog>=4.0",
    "structlog>=24.0",
    "pyyaml>=6.0",
    "cryptography>=42.0",
    "keyring>=25.0",
    "mcp>=1.0.0",
    "pysbd>=0.3.4",
    "langdetect>=1.0.9",
    "httpx>=0.27",
    "pyreadline3>=3.4; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "testcontainers>=4.0",
    "ruff>=0.8.0",
    "mypy>=1.13",
    "pre-commit>=3.8",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/clawtion/clawtion"
Repository = "https://github.com/clawtion/clawtion.git"
Issues = "https://github.com/clawtion/clawtion/issues"

[project.scripts]
clawtion = "clawtion.interfaces.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = [
    "clawtion.config.loader",
    "clawtion.interfaces.cli.config",
    "clawtion.i18n.translator",
]
ignore_missing_imports = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "clawtion.interfaces.mcp.tools",
    "clawtion.interfaces.mcp.server",
]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "clawtion.interfaces.api.*"
disallow_any_generics = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "clawtion.core.indexing.watcher",
    "clawtion.utils.logging",
    "clawtion.claude_integration.installer",
    "clawtion.utils.retry",
    "clawtion.interfaces.cli.main",
    "clawtion.interfaces.api.app",
    "clawtion.interfaces.cli.init",
    "clawtion.interfaces.api.routes.queue",
    "clawtion.utils.language",
    "clawtion.core.indexing.chunker",
]
ignore_errors = true

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "TCH",
    "RUF",
]
ignore = [
    "RUF002",  # Japanese docstrings use fullwidth characters
    "RUF003",  # Japanese comments use fullwidth characters
    "B008",    # FastAPI Depends() in function signature is standard pattern
    "E501",    # SQL strings and i18n messages naturally exceed line limits
    "RUF006",  # asyncio.ensure_future fire-and-forget pattern in file watcher
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src/clawtion"]
omit = ["tests/*", "*/templates/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "def __repr__",
    "@abstractmethod",
]
