repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: [--strict, src/]
        additional_dependencies: [pydantic>=2.0, click>=8.1, structlog>=24.0, pyyaml>=6.0]
        pass_filenames: false
